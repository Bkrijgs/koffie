# KFMon-launcher voor het espresso-dashboard.
# Komt op de Kobo in: /mnt/onboard/.adds/kfmon/config/espresso.ini
#
# Nickel importeert /mnt/onboard/espresso.png als "boek"; tik je die tegel in
# de bibliotheek aan, dan start KFMon het launch-script.

[watch]
filename = /mnt/onboard/espresso.png
label = Espresso
action = /mnt/onboard/.adds/espresso/launch.sh

# Voorkom dat andere KFMon-apps starten terwijl het dashboard draait.
block_spawns = 1
