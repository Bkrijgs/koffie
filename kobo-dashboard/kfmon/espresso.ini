# KFMon watch config for the Espresso dashboard.
# Installed to /mnt/onboard/.adds/kfmon/config/espresso.ini
#
# KFMon watches `filename` (a PNG that Nickel indexes as a book cover); tapping
# that cover in the Kobo library runs `action`. Nickel/KOReader stay installed,
# so this tile is purely additive — it never replaces the reader.
[watch]
filename = /mnt/onboard/icons/espresso.png
label = Espresso
action = /mnt/onboard/.adds/espresso/run.sh
# MUST stay false. The dashboard runs in -wall mode and never exits on its own,
# so block_spawns = true would make KFMon refuse to launch ANY tile (KOReader
# included) for as long as the dashboard is running. KFMon already prevents a
# duplicate of THIS watch on its own, so false is safe here.
block_spawns = false
# This isn't a real book, so keep Nickel's DB tidy.
skip_db_checks = false
do_db_update = false
